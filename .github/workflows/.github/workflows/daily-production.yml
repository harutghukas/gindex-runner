name: Daily production crawler

on:
  schedule:
    # 05:00 UTC = 09:00 Yerevan
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: gindex-production-crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out private crawler repository
        uses: actions/checkout@v4
        with:
          repository: harutghukas/price-comparison
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: price-comparison
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: price-comparison/requirements.txt

      - name: Install dependencies
        working-directory: price-comparison
        run: pip install -r requirements.txt

      - name: Create production env file
        working-directory: price-comparison
        run: |
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > .env.production.local
          printf 'SUPABASE_KEY=%s\n' "$SUPABASE_KEY" >> .env.production.local

      - name: Run all 9 production crawlers
        working-directory: price-comparison
        env:
          RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python -u -m scripts.local_staging.run_all_stores \
            --target production \
            --run-id "$RUN_ID"

      - name: Dispatch price alerts
        env:
          BASE_URL: ${{ secrets.PRICE_ALERT_URL }}
          CRON_KEY: ${{ secrets.PRICE_ALERT_CRON_SECRET }}
          RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 65 \
            -X POST \
            -H "Authorization: Bearer $CRON_KEY" \
            --data-urlencode "run_id=$RUN_ID" \
            -G "$BASE_URL/api/cron/dispatch-price-alerts"

      - name: Send Telegram alerts
        env:
          BASE_URL: ${{ secrets.PRICE_ALERT_URL }}
          CRON_KEY: ${{ secrets.PRICE_ALERT_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 65 \
            -X POST \
            -H "Authorization: Bearer $CRON_KEY" \
            "$BASE_URL/api/cron/send-price-alerts-batch"
